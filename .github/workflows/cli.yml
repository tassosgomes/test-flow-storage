name: CLI

on:
  push:
    branches: [main]
    tags: ["cli-v*"]
    paths:
      - "packages/cli/**"
      - "packages/schema/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/schema/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build schema and CLI
        run: |
          npm run build -w @tfs/schema
          npm run build -w @tfs/cli

      - name: Bundle CLI
        run: npm run bundle -w @tfs/cli

      - name: Smoke test bundle
        run: node packages/cli/dist/tfs.js --help

      - name: Test schema
        run: npx vitest run packages

      - uses: actions/upload-artifact@v4
        with:
          name: tfs-cli
          path: packages/cli/dist/tfs.js

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build bundle
        run: |
          npm run build -w @tfs/schema
          npm run build -w @tfs/cli
          npm run bundle -w @tfs/cli

      - name: Check tag matches CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli version ${version}" >&2
            exit 1
          fi

      - name: Create GitHub release
        run: |
          cp packages/cli/dist/tfs.js "tfs-${GITHUB_REF_NAME#cli-v}.js"
          sha256sum "tfs-${GITHUB_REF_NAME#cli-v}.js" > checksums.txt
          gh release create "${GITHUB_REF_NAME}" \
            "tfs-${GITHUB_REF_NAME#cli-v}.js" checksums.txt \
            --title "tfs CLI ${GITHUB_REF_NAME#cli-v}" \
            --generate-notes
